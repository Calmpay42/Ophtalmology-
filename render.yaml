services:
  - type: web
    name: ophtasuite-serveur
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: OPHTA_API_KEY
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
